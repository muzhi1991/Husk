name: PR device validation
on:
  push:
    branches: [qa/pr-device-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain and host regressions
        run: |
          xcodebuild -version
          brew install xcodegen
          python3 -m venv /tmp/husk-ci-python
          /tmp/husk-ci-python/bin/pip install PyYAML
          rustup target add aarch64-apple-ios
          sh tests/translation-layer/run_font_paths.sh
          sh tests/translation-layer/run_compressed_heap.sh
      - name: Stage pinned official runtime dependencies
        run: |
          mkdir -p build
          curl --fail --location --retry 3 https://github.com/Leviidev/Husk/releases/download/3.0/Husk.ipa -o build/official.ipa
          /tmp/husk-ci-python/bin/python scripts/ci_stage_pr_validation.py build/official.ipa
          rm build/official.ipa
      - run: bash scripts/build_rppairing_ios.sh
      - run: bash scripts/package_ipa.sh "$PWD/build/com.husk.app.ipa"
      - name: Record source and artifact identity
        run: |
          git rev-parse HEAD > build/SOURCE_COMMIT
          shasum -a 256 build/com.husk.app.ipa > build/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Husk-PR-validation
          path: |
            build/com.husk.app.ipa
            build/SHA256SUMS
            build/SOURCE_COMMIT
            build/runtime-manifest.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: validation-build-logs
          path: /tmp/husk_ipa/build.log
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
      - name: Build independent Flutter fixture
        run: |
          flutter --version --machine > flutter-version.json
          flutter create --platforms android --org org.example --project-name flutter_compat_probe /tmp/flutter-compat-probe
          cp tests/flutter-compat-probe/main.dart /tmp/flutter-compat-probe/lib/main.dart
          cd /tmp/flutter-compat-probe
          flutter build apk --release --target-platform android-arm64
          sha256sum build/app/outputs/flutter-apk/app-release.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Flutter-compat-probe
          path: |
            /tmp/flutter-compat-probe/build/app/outputs/flutter-apk/app-release.apk
            /tmp/flutter-compat-probe/SHA256SUMS
            flutter-version.json
          retention-days: 7
